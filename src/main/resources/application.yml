server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: test

  application:
    name: cordys-crm

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cordys_crm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.cordyscrm: info
