spring.application.name=CordysCRM

# ================= 数据源（按本机环境修改账号密码） =================
spring.datasource.url=jdbc:mysql://localhost:3306/cordys_crm?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# ================= 数据库初始化 =================
# 首次启动自动执行 db/schema.sql 建表并写入字典种子数据（脚本幂等，可重复执行）
# 注意：数据库 cordys_crm 本身需先创建，见 db/create-database.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8
